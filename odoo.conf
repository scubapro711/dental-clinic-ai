[options]
; Database settings
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_maxconn = 64

; Addons path
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Server settings
xmlrpc_port = 8069
longpolling_port = 8072

; Performance
workers = 2
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

; Logging
log_level = info
log_handler = :INFO

; Security
admin_passwd = admin123
list_db = True

; Session
session_timeout = 3600

; XMLRPC
xmlrpc = True
xmlrpc_interface = 0.0.0.0

; Proxy mode (if behind nginx)
proxy_mode = False
