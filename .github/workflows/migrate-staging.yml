name: Run Database Migrations - Staging

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/alembic/versions/**'
      - 'backend/app/models/**'
      - '.github/workflows/migrate-staging.yml'
  workflow_dispatch:

env:
  PROJECT_ID: dentaflow-production
  REGION: us-central1
  INSTANCE_NAME: dentaflow-db-instance
  DATABASE_NAME: dentaflow

jobs:
  migrate:
    name: Run Alembic Migrations (Staging)
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      
      - name: Install Cloud SQL Proxy
        run: |
          wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O cloud_sql_proxy
          chmod +x cloud_sql_proxy
      
      - name: Start Cloud SQL Proxy
        run: |
          ./cloud_sql_proxy -instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.INSTANCE_NAME }}=tcp:5432 &
          sleep 5
          echo "Cloud SQL Proxy started"
      
      - name: Check current migration status
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          echo "Current migration status:"
          alembic current || echo "No migrations applied yet"
          echo ""
          echo "Pending migrations:"
          alembic history || echo "No migration history"
      
      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          echo "Running migrations..."
          alembic upgrade head
          echo "✅ Migrations completed successfully"
      
      - name: Verify migration
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          echo "Verifying migration status:"
          alembic current
          echo "✅ Migration verification completed"
      
      - name: Test database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          python3 << 'EOF'
          import os
          import psycopg2
          from urllib.parse import urlparse
          
          db_url = os.environ['DATABASE_URL']
          
          try:
              # Parse DATABASE_URL
              if db_url.startswith('postgresql://'):
                  conn = psycopg2.connect(db_url)
              else:
                  # Handle Cloud SQL socket format
                  conn = psycopg2.connect(db_url)
              
              cursor = conn.cursor()
              
              # Test query
              cursor.execute("SELECT version();")
              version = cursor.fetchone()
              print(f"✅ Database connection successful")
              print(f"PostgreSQL version: {version[0]}")
              
              # Check if organizations table exists
              cursor.execute("""
                  SELECT EXISTS (
                      SELECT FROM information_schema.tables 
                      WHERE table_schema = 'public' 
                      AND table_name = 'organizations'
                  );
              """)
              exists = cursor.fetchone()[0]
              print(f"✅ Organizations table exists: {exists}")
              
              # Check subscription_tier enum values
              cursor.execute("""
                  SELECT enumlabel 
                  FROM pg_enum 
                  WHERE enumtypid = (
                      SELECT oid FROM pg_type WHERE typname = 'subscriptiontier'
                  )
                  ORDER BY enumsortorder;
              """)
              enum_values = [row[0] for row in cursor.fetchall()]
              print(f"✅ SubscriptionTier enum values: {enum_values}")
              
              cursor.close()
              conn.close()
              
              print("\n✅ All database checks passed!")
              
          except Exception as e:
              print(f"❌ Database check failed: {e}")
              exit(1)
          EOF
      
      - name: Health check staging API
        run: |
          echo "Checking staging API health..."
          sleep 5
          
          # Try to reach staging frontend
          STAGING_URL="https://dentaflow-frontend-staging-gmi5lyn5wq-uc.a.run.app"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $STAGING_URL/health || echo "000")
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
            echo "✅ Staging frontend is accessible (HTTP $HTTP_CODE)"
          else
            echo "⚠️  Staging frontend returned HTTP $HTTP_CODE"
          fi
      
      - name: Cleanup
        if: always()
        run: |
          echo "Stopping Cloud SQL Proxy..."
          pkill -f cloud_sql_proxy || true
          echo "✅ Cleanup completed"
      
      - name: Summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ STAGING MIGRATION COMPLETED SUCCESSFULLY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Environment: Staging"
          echo "Database: ${{ env.DATABASE_NAME }}"
          echo "Instance: ${{ env.INSTANCE_NAME }}"
          echo ""
          echo "Next steps:"
          echo "1. Test the staging environment"
          echo "2. Verify organization creation works"
          echo "3. If all looks good, merge to main for production"
          echo ""
          echo "Staging URL: https://dentaflow-frontend-staging-gmi5lyn5wq-uc.a.run.app"
