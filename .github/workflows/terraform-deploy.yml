name: Deploy Infrastructure with Terraform

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:  # Allow manual trigger

env:
  TF_VERSION: '1.5.0'
  GCP_PROJECT_ID: 'dentaflow-production'
  GCP_REGION: 'us-central1'

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Terraform Init
        working-directory: ./terraform/environments/dev
        run: terraform init
      
      - name: Terraform Format Check
        working-directory: ./terraform/environments/dev
        run: terraform fmt -check -recursive || true
      
      - name: Terraform Validate
        working-directory: ./terraform/environments/dev
        run: terraform validate
      
      - name: Terraform Plan
        working-directory: ./terraform/environments/dev
        run: |
          terraform plan \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -out=tfplan
      
      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/environments/dev/tfplan
  
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Terraform Init
        working-directory: ./terraform/environments/dev
        run: terraform init
      
      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/environments/dev/
      
      - name: Terraform Apply
        working-directory: ./terraform/environments/dev
        run: terraform apply -auto-approve tfplan
      
      - name: Verify Backup Configuration
        run: |
          echo "Verifying Cloud SQL backup configuration..."
          gcloud sql instances describe dentaflow-db-instance \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format="yaml(settings.backupConfiguration)" || echo "Instance not found or not ready"
      
      - name: Notify Success
        if: success()
        run: |
          echo "✅ Terraform deployment successful!"
          echo "Backup configuration has been applied to Cloud SQL instance"
      
      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Terraform deployment failed!"
          echo "Check logs for details"

