name: Run Database Migrations - Production

on:
  push:
    branches:
      - main
    paths:
      - 'backend/alembic/versions/**'
      - 'backend/app/models/**'
      - '.github/workflows/migrate-production.yml'
  workflow_dispatch:

env:
  PROJECT_ID: dentaflow-production
  REGION: us-central1
  INSTANCE_NAME: dentaflow-db-instance
  DATABASE_NAME: dentaflow

jobs:
  migrate:
    name: Run Alembic Migrations (Production)
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install alembic psycopg2-binary sqlalchemy
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      
      - name: Create database backup
        run: |
          echo "Creating database backup before migration..."
          BACKUP_NAME="pre-migration-backup-$(date +%Y%m%d-%H%M%S)"
          
          gcloud sql backups create \
            --instance=${{ env.INSTANCE_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --description="Pre-migration backup from GitHub Actions" \
            --async
          
          echo "✅ Backup initiated: $BACKUP_NAME"
          echo "BACKUP_NAME=$BACKUP_NAME" >> $GITHUB_ENV
          
          # Wait a bit for backup to start
          sleep 10
      
      - name: Install Cloud SQL Proxy
        run: |
          wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O cloud_sql_proxy
          chmod +x cloud_sql_proxy
      
      - name: Start Cloud SQL Proxy
        run: |
          ./cloud_sql_proxy -instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.INSTANCE_NAME }}=tcp:5432 &
          sleep 5
          echo "Cloud SQL Proxy started"
      
      - name: Check current migration status
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          echo "Current migration status:"
          alembic current || echo "No migrations applied yet"
          echo ""
          echo "Pending migrations:"
          alembic history || echo "No migration history"
      
      - name: Run migrations
        id: migration
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          echo "Running migrations..."
          alembic upgrade head
          echo "✅ Migrations completed successfully"
          echo "migration_status=success" >> $GITHUB_OUTPUT
      
      - name: Verify migration
        if: steps.migration.outputs.migration_status == 'success'
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          echo "Verifying migration status:"
          alembic current
          echo "✅ Migration verification completed"
      
      - name: Test database connection
        if: steps.migration.outputs.migration_status == 'success'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          python3 << 'EOF'
          import os
          import psycopg2
          from urllib.parse import urlparse
          
          db_url = os.environ['DATABASE_URL']
          
          try:
              # Parse DATABASE_URL
              if db_url.startswith('postgresql://'):
                  conn = psycopg2.connect(db_url)
              else:
                  # Handle Cloud SQL socket format
                  conn = psycopg2.connect(db_url)
              
              cursor = conn.cursor()
              
              # Test query
              cursor.execute("SELECT version();")
              version = cursor.fetchone()
              print(f"✅ Database connection successful")
              print(f"PostgreSQL version: {version[0]}")
              
              # Check if organizations table exists
              cursor.execute("""
                  SELECT EXISTS (
                      SELECT FROM information_schema.tables 
                      WHERE table_schema = 'public' 
                      AND table_name = 'organizations'
                  );
              """)
              exists = cursor.fetchone()[0]
              print(f"✅ Organizations table exists: {exists}")
              
              # Check subscription_tier enum values
              cursor.execute("""
                  SELECT enumlabel 
                  FROM pg_enum 
                  WHERE enumtypid = (
                      SELECT oid FROM pg_type WHERE typname = 'subscriptiontier'
                  )
                  ORDER BY enumsortorder;
              """)
              enum_values = [row[0] for row in cursor.fetchall()]
              print(f"✅ SubscriptionTier enum values: {enum_values}")
              
              # Count organizations
              cursor.execute("SELECT COUNT(*) FROM organizations;")
              count = cursor.fetchone()[0]
              print(f"✅ Total organizations: {count}")
              
              cursor.close()
              conn.close()
              
              print("\n✅ All database checks passed!")
              
          except Exception as e:
              print(f"❌ Database check failed: {e}")
              exit(1)
          EOF
      
      - name: Health check production API
        if: steps.migration.outputs.migration_status == 'success'
        run: |
          echo "Checking production API health..."
          sleep 5
          
          # Try to reach production backend
          PROD_URL="https://dentaflow-backend-gmi5lyn5wq-uc.a.run.app"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $PROD_URL/health || echo "000")
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Production backend is healthy (HTTP $HTTP_CODE)"
          else
            echo "⚠️  Production backend returned HTTP $HTTP_CODE"
            echo "This might be expected if the service is still starting"
          fi
      
      - name: Rollback on failure
        if: failure() && steps.migration.outputs.migration_status != 'success'
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          echo "❌ Migration failed! Attempting rollback..."
          alembic downgrade -1 || echo "⚠️  Rollback failed or not applicable"
          echo ""
          echo "⚠️  MANUAL INTERVENTION REQUIRED"
          echo "Please check the logs and restore from backup if needed:"
          echo "Backup: ${{ env.BACKUP_NAME }}"
      
      - name: Cleanup
        if: always()
        run: |
          echo "Stopping Cloud SQL Proxy..."
          pkill -f cloud_sql_proxy || true
          echo "✅ Cleanup completed"
      
      - name: Summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ PRODUCTION MIGRATION COMPLETED SUCCESSFULLY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Environment: Production"
          echo "Database: ${{ env.DATABASE_NAME }}"
          echo "Instance: ${{ env.INSTANCE_NAME }}"
          echo "Backup: ${{ env.BACKUP_NAME }}"
          echo ""
          echo "Next steps:"
          echo "1. Monitor production for any issues"
          echo "2. Verify organization creation works"
          echo "3. Check application logs"
          echo ""
          echo "Production URL: https://dentaflow.ai"
      
      - name: Failure summary
        if: failure()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ PRODUCTION MIGRATION FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Environment: Production"
          echo "Backup: ${{ env.BACKUP_NAME }}"
          echo ""
          echo "IMMEDIATE ACTIONS REQUIRED:"
          echo "1. Check the logs above for error details"
          echo "2. Verify database state"
          echo "3. Consider restoring from backup if needed:"
          echo "   gcloud sql backups restore ${{ env.BACKUP_NAME }} \\"
          echo "     --backup-instance=${{ env.INSTANCE_NAME }} \\"
          echo "     --backup-project=${{ env.PROJECT_ID }}"
          echo ""
          echo "Contact: DevOps team"
