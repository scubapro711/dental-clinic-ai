name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

env:
  PROJECT_ID: dentaflow-production
  REGION: us-central1
  SERVICE_NAME: dentaflow-backend

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      
      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker gcr.io
      
      - name: Build and Push Docker Image
        working-directory: ./backend
        run: |
          IMAGE_TAG="v$(date +%Y%m%d-%H%M%S )-${GITHUB_SHA::8}"
          IMAGE_NAME="gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${IMAGE_TAG}"
          IMAGE_LATEST="gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest"
          
          echo "Building image: $IMAGE_NAME"
          docker build -t $IMAGE_NAME -t $IMAGE_LATEST .
          
          echo "Pushing image to GCR..."
          docker push $IMAGE_NAME
          docker push $IMAGE_LATEST
          
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_NAME }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 4Gi \
            --cpu 2 \
            --timeout 300 \
            --max-instances 10 \
            --min-instances 1 \
            --set-env-vars "APP_ENV=production,DEBUG=false,LOG_LEVEL=INFO,APP_HOST=0.0.0.0,APP_PORT=8080,GCP_PROJECT_ID=dentaflow-production,GCP_REGION=us-central1,ENABLE_GCP_MONITORING=false" \
            --set-secrets "SECRET_KEY=secret-key:latest,JWT_SECRET=jwt-secret:latest,DATABASE_URL=database-url:latest,CHECKPOINT_DATABASE_URL=checkpoint-database-url:latest,REDIS_URL=redis-url:latest,ODOO_URL=odoo-url:latest,ODOO_DB=odoo-db:latest,ODOO_USERNAME=odoo-username:latest,ODOO_PASSWORD=odoo-password:latest,OPENAI_API_KEY=openai-api-key:latest,PINECONE_API_KEY=pinecone-api-key:latest,TELEGRAM_BOT_TOKEN=telegram-bot-token:latest" \
            --add-cloudsql-instances "dentaflow-production:us-central1:dentaflow-db-instance" \
            --quiet
      
      - name: Get Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Service deployed to: $SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
      
      - name: Verify Deployment
        run: |
          echo "Waiting for service to be ready..."
          sleep 10
          
          HEALTH_CHECK=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.SERVICE_URL }}/health || echo "000"  )
          
          if [ "$HEALTH_CHECK" = "200" ]; then
            echo "✅ Deployment successful! Service is healthy."
          else
            echo "⚠️  Warning: Health check returned $HEALTH_CHECK"
          fi
