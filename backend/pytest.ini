[pytest]
# Test discovery
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=app
    --cov-report=html:test-results/coverage/html
    --cov-report=term-missing:skip-covered
    --cov-report=json:test-results/coverage.json
    --cov-report=xml:test-results/coverage.xml
    --cov-fail-under=80
    --cov-branch

# Asyncio
asyncio_mode = auto

# Markers
markers =
    asyncio: Async tests
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    fast: Fast running tests
    security: Security tests
    hipaa: HIPAA compliance tests
    performance: Performance tests
    regression: Regression tests
    smoke: Smoke tests
    models: Model tests
    services: Service tests
    api: API tests
    auth: Authentication tests
    agents: Agent tests
    integrations: Integration tests with external services
    critical: Critical tests that must pass
    high: High priority tests
    medium: Medium priority tests
    low: Low priority tests
    requires_db: Tests that require database
    requires_redis: Tests that require Redis
    requires_external: Tests that require external services
    skip_ci: Skip in CI environment
    wip: Work in progress tests
    benchmark: Benchmark tests
    load: Load tests
    perf: Performance tests
    stress: Stress tests
    core: Core utility tests
    utils: Utility function tests

# Coverage
[coverage:run]
source = app
omit = 
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = test-results/coverage/html
