steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/dentaflow-production/dentaflow/dentaflow-backend-staging:${SHORT_SHA}'
      - '-t'
      - 'us-central1-docker.pkg.dev/dentaflow-production/dentaflow/dentaflow-backend-staging:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/dentaflow-production/dentaflow/dentaflow-backend-staging:${SHORT_SHA}'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/dentaflow-production/dentaflow/dentaflow-backend-staging:latest'

  # Deploy container image to Cloud Run STAGING
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dentaflow-backend-staging'
      - '--image'
      - 'us-central1-docker.pkg.dev/dentaflow-production/dentaflow/dentaflow-backend-staging:${SHORT_SHA}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--set-secrets=DATABASE_URL=database-url-staging:latest,CHECKPOINT_DATABASE_URL=checkpoint-database-url-staging:latest,OPENAI_API_KEY=openai-api-key:latest,PINECONE_API_KEY=pinecone-api-key:latest,REDIS_URL=redis-url:latest,SECRET_KEY=secret-key:latest,JWT_SECRET=jwt-secret:latest,ODOO_URL=odoo-url:latest,ODOO_USERNAME=odoo-username:latest,ODOO_PASSWORD=odoo-password:latest,ODOO_DB=odoo-db:latest'
      - '--set-env-vars=ENVIRONMENT=staging,DEBUG=false,PROJECT_ID=dentaflow-production'
      - '--add-cloudsql-instances'
      - 'dentaflow-production:us-central1:dentaflow-db-staging'
      - '--vpc-connector'
      - 'dentaflow-vpc-connector'
      - '--vpc-egress'
      - 'private-ranges-only'

images:
  - 'us-central1-docker.pkg.dev/dentaflow-production/dentaflow/dentaflow-backend-staging:${SHORT_SHA}'
  - 'us-central1-docker.pkg.dev/dentaflow-production/dentaflow/dentaflow-backend-staging:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
