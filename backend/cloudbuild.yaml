steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/dentaflow-production/dentaflow-backend:${SHORT_SHA}'
      - '-t'
      - 'gcr.io/dentaflow-production/dentaflow-backend:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/dentaflow-production/dentaflow-backend:${SHORT_SHA}'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/dentaflow-production/dentaflow-backend:latest'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dentaflow-backend'
      - '--image'
      - 'gcr.io/dentaflow-production/dentaflow-backend:${SHORT_SHA}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'

images:
  - 'gcr.io/dentaflow-production/dentaflow-backend:${SHORT_SHA}'
  - 'gcr.io/dentaflow-production/dentaflow-backend:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
