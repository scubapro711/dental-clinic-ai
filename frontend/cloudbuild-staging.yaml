# Cloud Build configuration for staging deployment
# Triggers on push to 'develop' branch
# Deploys to: dentaflow-frontend-staging

steps:
  # Step 0: Run tests (fail-fast if tests fail)
  - name: 'node:22'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Installing pnpm..."
        npm install -g pnpm@latest
        
        echo "Installing dependencies..."
        pnpm install --frozen-lockfile
        
        echo "Running unit tests..."
        pnpm test:run
        
        if [ $? -ne 0 ]; then
          echo "❌ Tests failed! Stopping deployment."
          exit 1
        fi
        
        echo "✅ All tests passed! Proceeding with deployment."
    dir: 'frontend'
    id: 'run-tests'

  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    waitFor: ['run-tests']  # Only build if tests pass
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/dentaflow-frontend-staging:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/dentaflow-frontend-staging:latest'
      - '--build-arg'
      - 'VITE_APP_ENV=staging'
      - '--build-arg'
      - 'VITE_API_URL=https://dentaflow-backend-staging-gmi5lyn5wq-uc.a.run.app'
      - '-f'
      - 'Dockerfile'
      - '.'
    dir: 'frontend'

  # Step 2: Push image with commit SHA tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/dentaflow-frontend-staging:$SHORT_SHA'

  # Step 3: Push image with latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/dentaflow-frontend-staging:latest'

  # Step 4: Deploy to Cloud Run (Staging)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dentaflow-frontend-staging'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/dentaflow-frontend-staging:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'VITE_APP_ENV=staging'
      - '--tag'
      - 'staging-$SHORT_SHA'
      - '--no-traffic'  # Don't send traffic to new revision yet

  # Step 5: Gradually migrate traffic to new revision
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'dentaflow-frontend-staging'
      - '--to-latest'
      - '--region'
      - 'us-central1'

# Build timeout (20 minutes)
timeout: '1200s'

# Substitutions for variables
substitutions:
  _SERVICE_NAME: dentaflow-frontend-staging
  _REGION: us-central1
  _ENV: staging

# Build options
options:
  # Use Cloud Logging for better log management
  logging: CLOUD_LOGGING_ONLY
  
  # Use high-CPU machine for faster builds
  machineType: 'E2_HIGHCPU_8'
  
  # Increase disk size for large builds
  diskSizeGb: 100
  
  # Substitution option
  substitutionOption: 'ALLOW_LOOSE'

# Images to be pushed to Artifact Registry
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/dentaflow-frontend-staging:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/dentaflow-frontend-staging:latest'

