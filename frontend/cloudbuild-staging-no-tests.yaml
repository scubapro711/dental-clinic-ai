# Cloud Build configuration for staging deployment (without tests)
# Use this for emergency deployments when tests are failing due to environment issues

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/dentaflow-frontend-staging:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/dentaflow-frontend-staging:latest'
      - '--build-arg'
      - 'VITE_APP_ENV=staging'
      - '--build-arg'
      - 'VITE_API_BASE_URL=https://dentaflow-backend-staging-gmi5lyn5wq-uc.a.run.app'
      - '-f'
      - 'Dockerfile'
      - '.'
    dir: 'frontend'

  # Step 2: Push image with commit SHA tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/dentaflow-frontend-staging:$SHORT_SHA'

  # Step 3: Push image with latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/dentaflow-frontend-staging:latest'

  # Step 4: Deploy to Cloud Run (Staging)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dentaflow-frontend-staging'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/dentaflow-frontend-staging:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'VITE_APP_ENV=staging'
      - '--tag'
      - 'staging-$SHORT_SHA'

  # Step 5: Migrate all traffic to new revision
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'dentaflow-frontend-staging'
      - '--to-latest'
      - '--region'
      - 'us-central1'

# Build timeout (20 minutes)
timeout: '1200s'

# Substitutions for variables
substitutions:
  _SERVICE_NAME: dentaflow-frontend-staging
  _REGION: us-central1
  _ENV: staging

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  substitutionOption: 'ALLOW_LOOSE'

# Images to be pushed to Artifact Registry
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/dentaflow-frontend-staging:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/dentaflow-frontend-staging:latest'
