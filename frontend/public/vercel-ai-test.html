<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vercel AI SDK Test - DentalAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        
        .header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .header .info {
            display: flex;
            gap: 16px;
            font-size: 14px;
            color: #666;
        }
        
        .agent-badge {
            padding: 4px 12px;
            background: #e3f2fd;
            color: #1976d2;
            border-radius: 12px;
            font-weight: 500;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message {
            display: flex;
            max-width: 70%;
        }
        
        .message.user {
            align-self: flex-end;
        }
        
        .message.assistant {
            align-self: flex-start;
        }
        
        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }
        
        .message.user .message-content {
            background: #2196f3;
            color: white;
        }
        
        .message.assistant .message-content {
            background: #f5f5f5;
            color: #333;
        }
        
        .message.error .message-content {
            background: #ffebee;
            color: #c62828;
        }
        
        .agent-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .streaming-indicator {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: #666;
            margin-left: 4px;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
        }
        
        .empty-state h2 {
            font-size: 32px;
            margin-bottom: 16px;
        }
        
        .suggestions {
            list-style: none;
            margin-top: 16px;
        }
        
        .suggestions li {
            margin: 8px 0;
            font-size: 14px;
        }
        
        .input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
        }
        
        .input-form {
            display: flex;
            gap: 12px;
        }
        
        .input-form input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        
        .input-form input:focus {
            border-color: #2196f3;
        }
        
        .input-form button {
            padding: 12px 24px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .input-form button:hover:not(:disabled) {
            background: #1976d2;
        }
        
        .input-form button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .clear-btn {
            padding: 8px 16px;
            background: white;
            color: #666;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .clear-btn:hover {
            background: #f5f5f5;
        }
        
        .status {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Vercel AI SDK + LangGraph Test</h1>
            <div class="info">
                <span id="conversation-id">Conversation: Loading...</span>
                <span id="agent-badge" class="agent-badge" style="display: none;">Agent: None</span>
                <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
            </div>
        </div>
        
        <div class="messages" id="messages">
            <div class="empty-state">
                <h2>👋 Hello!</h2>
                <p>Try asking:</p>
                <ul class="suggestions">
                    <li>💬 "Schedule an appointment for next Monday"</li>
                    <li>💰 "What is our revenue this month?"</li>
                    <li>📅 "Show me today's appointments"</li>
                </ul>
            </div>
        </div>
        
        <div class="input-area">
            <form class="input-form" onsubmit="sendMessage(event)">
                <input 
                    type="text" 
                    id="message-input" 
                    placeholder="Type your message..." 
                    autocomplete="off"
                />
                <button type="submit" id="send-btn">Send</button>
            </form>
            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        let conversationId = `conv_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        let messages = [];
        let isLoading = false;
        
        // Update conversation ID display
        document.getElementById('conversation-id').textContent = `Conversation: ${conversationId}`;
        
        function addMessage(role, content, agent = null, error = false) {
            const messagesDiv = document.getElementById('messages');
            
            // Remove empty state if it exists
            const emptyState = messagesDiv.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}${error ? ' error' : ''}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (role === 'assistant' && agent) {
                const agentLabel = document.createElement('div');
                agentLabel.className = 'agent-label';
                agentLabel.textContent = agent;
                contentDiv.appendChild(agentLabel);
            }
            
            const textDiv = document.createElement('div');
            textDiv.textContent = content;
            contentDiv.appendChild(textDiv);
            
            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);
            
            // Scroll to bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            return messageDiv;
        }
        
        function updateStreamingMessage(messageDiv, content) {
            const textDiv = messageDiv.querySelector('.message-content > div:last-child');
            textDiv.innerHTML = content + '<span class="streaming-indicator"></span>';
        }
        
        function finalizeStreamingMessage(messageDiv, content) {
            const textDiv = messageDiv.querySelector('.message-content > div:last-child');
            textDiv.textContent = content;
        }
        
        function updateAgent(agent) {
            const agentBadge = document.getElementById('agent-badge');
            agentBadge.textContent = `Agent: ${agent}`;
            agentBadge.style.display = 'inline-block';
        }
        
        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }
        
        async function sendMessage(event) {
            event.preventDefault();
            
            if (isLoading) return;
            
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            
            if (!content) return;
            
            // Add user message
            addMessage('user', content);
            messages.push({ role: 'user', content });
            
            // Clear input
            input.value = '';
            
            // Set loading state
            isLoading = true;
            document.getElementById('send-btn').disabled = true;
            setStatus('Sending...');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/v1/ai/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        messages: messages,
                        conversation_id: conversationId,
                        stream: true,
                    }),
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                setStatus('Receiving response...');
                
                // Create streaming message
                let streamingMessageDiv = null;
                let fullMessage = '';
                let currentAgent = null;
                
                // Parse SSE stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    
                    // Split by double newline (SSE format)
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop() || '';
                    
                    // Process complete lines
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            
                            try {
                                const chunk = JSON.parse(data);
                                
                                if (chunk.type === 'text') {
                                    fullMessage += chunk.content;
                                    
                                    if (chunk.metadata?.agent) {
                                        currentAgent = chunk.metadata.agent;
                                        updateAgent(currentAgent);
                                    }
                                    
                                    if (!streamingMessageDiv) {
                                        streamingMessageDiv = addMessage('assistant', '', currentAgent);
                                    }
                                    
                                    updateStreamingMessage(streamingMessageDiv, fullMessage);
                                    
                                } else if (chunk.type === 'tool_call') {
                                    setStatus(`Tool: ${chunk.tool_name}`);
                                    
                                } else if (chunk.type === 'done') {
                                    if (streamingMessageDiv) {
                                        finalizeStreamingMessage(streamingMessageDiv, fullMessage);
                                    }
                                    
                                    messages.push({
                                        role: 'assistant',
                                        content: fullMessage,
                                    });
                                    
                                    setStatus('');
                                    
                                } else if (chunk.type === 'error') {
                                    throw new Error(chunk.content || 'Unknown error');
                                }
                            } catch (e) {
                                console.error('Failed to parse chunk:', e, data);
                            }
                        }
                    }
                }
                
            } catch (error) {
                console.error('Chat error:', error);
                addMessage('assistant', `Sorry, I encountered an error: ${error.message}`, null, true);
                setStatus('Error occurred');
            } finally {
                isLoading = false;
                document.getElementById('send-btn').disabled = false;
            }
        }
        
        function clearChat() {
            messages = [];
            conversationId = `conv_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
            document.getElementById('conversation-id').textContent = `Conversation: ${conversationId}`;
            document.getElementById('agent-badge').style.display = 'none';
            
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = `
                <div class="empty-state">
                    <h2>👋 Hello!</h2>
                    <p>Try asking:</p>
                    <ul class="suggestions">
                        <li>💬 "Schedule an appointment for next Monday"</li>
                        <li>💰 "What is our revenue this month?"</li>
                        <li>📅 "Show me today's appointments"</li>
                    </ul>
                </div>
            `;
            
            setStatus('');
        }
    </script>
</body>
</html>
