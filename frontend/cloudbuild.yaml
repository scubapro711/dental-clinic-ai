steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/dentaflow-production/cloud-run-source-deploy/dentaflow-frontend:$SHORT_SHA', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/dentaflow-production/cloud-run-source-deploy/dentaflow-frontend:$SHORT_SHA']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dentaflow-frontend'
      - '--image'
      - 'us-central1-docker.pkg.dev/dentaflow-production/cloud-run-source-deploy/dentaflow-frontend:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '80'
images:
  - 'us-central1-docker.pkg.dev/dentaflow-production/cloud-run-source-deploy/dentaflow-frontend:$SHORT_SHA'
# Increase timeout for npm build
timeout: 1800s  # 30 minutes

