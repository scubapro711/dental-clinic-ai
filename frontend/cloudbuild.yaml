steps:
  # Step 0: Run tests (fail-fast if tests fail)
  - name: 'node:22'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🧪 Running tests before production deployment..."
        echo "Installing pnpm..."
        npm install -g pnpm@latest
        
        echo "Installing dependencies..."
        pnpm install --frozen-lockfile
        
        echo "Running unit tests..."
        pnpm test:run
        
        if [ $? -ne 0 ]; then
          echo "❌ Tests failed! Stopping production deployment."
          exit 1
        fi
        
        echo "✅ All tests passed! Proceeding with production deployment."
    dir: 'frontend'
    id: 'run-tests'

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    waitFor: ['run-tests']  # Only build if tests pass
    args: 
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/dentaflow-production/cloud-run-source-deploy/dentaflow-frontend:${SHORT_SHA}'
      - '-t'
      - 'us-central1-docker.pkg.dev/dentaflow-production/cloud-run-source-deploy/dentaflow-frontend:latest'
      - '.'
  
  # Push the container images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push'
      - 'us-central1-docker.pkg.dev/dentaflow-production/cloud-run-source-deploy/dentaflow-frontend:${SHORT_SHA}'
  
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push'
      - 'us-central1-docker.pkg.dev/dentaflow-production/cloud-run-source-deploy/dentaflow-frontend:latest'
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'dentaflow-frontend'
      - '--image'
      - 'us-central1-docker.pkg.dev/dentaflow-production/cloud-run-source-deploy/dentaflow-frontend:${SHORT_SHA}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '80'

images:
  - 'us-central1-docker.pkg.dev/dentaflow-production/cloud-run-source-deploy/dentaflow-frontend:${SHORT_SHA}'
  - 'us-central1-docker.pkg.dev/dentaflow-production/cloud-run-source-deploy/dentaflow-frontend:latest'

# Increase timeout for npm build
timeout: 1800s  # 30 minutes

